# 主工作流名称：Python定时脚本 + 仓库活跃保持
name: Run Python Script on Schedule

# ====================== 全局配置 ======================
# 第一方 action 已升级到原生 node24（checkout@v6 / setup-python@v6）。
# 该变量保留给仍声明 node20 的第三方 action，GitHub 自 2026-06-02 起已默认使用 node24，
# 故此处声明属于兜底、不再产生弃用告警。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 权限按 Job 单独声明：一旦在此处声明，未列出的权限会被置为 none，
# 因此不在全局声明，避免误伤需要 contents: read 的 checkout。

# ====================== 触发规则区（统一管理） ======================
on:
  schedule:
    - cron: "55 20 * * *"   # Python脚本定时，每天 北京时间(UTC+8)  04:55 执行（需根据您的时区换算）
    - cron: "55 19 1 * *"   # 每月1日 北京时间(UTC+8) 03:55 执行保活提交
  workflow_dispatch:        # 可手动触发
    inputs:
      run_task:
        description: '选择要运行的任务'
        required: false
        default: 'python_script'
        type: choice
        options:
          - python_script  # 仅运行Python脚本
          - keep_alive     # 仅保持仓库活跃

# ====================== 任务区（完全拆分为两个独立Job） ======================
jobs:
  # ---------------------- 第一部分：Python脚本运行逻辑 ----------------------
  run-script:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '55 20 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_task == 'python_script') ||
      (github.event_name == 'workflow_dispatch' && !github.event.inputs.run_task)
    runs-on: windows-latest       # 分配的虚拟机环境
    environment: ConfigConvert    # 关键：指定使用的环境，才能访问对应的环境级Secret
    name: Run Python Scheduled Script
    permissions:
      contents: read             # 仅需拉取代码，不需要写权限

    steps:
    # 步骤1：拉取代码
    - name: Checkout code
      uses: actions/checkout@v6

    # 步骤2：配置Python环境
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"   # 3.10 已于 2026-10 结束安全支持，升级到 3.12
        cache: 'pip'             # 按 requirements.txt 的哈希缓存 wheel，减少重复下载

    # 步骤3：安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤4：运行重构后的入口脚本
    - name: Run main script
      run: |
        python main.py
      env:
        PYTHONIOENCODING: utf-8
        ACTIONS_STEP_DEBUG: true
        ACTIONS_RUNNER_DEBUG: true
        # 环境变量将由 config.py 统一接管读取
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_FILENAME: ${{ secrets.GIST_FILENAME }}
        CONFIG_URL: ${{ secrets.CONFIG_URL }}
        SUBSCRIBE_LIST: ${{ secrets.SUBSCRIBE_LIST }}

  # ---------------------- 第二部分：仓库保活逻辑 ----------------------
  # 公开仓库连续 60 天没有提交，GitHub 会自动停用所有定时工作流。
  # 调用 dispatches API 只产生运行记录、不算仓库活动，因此改为推送一次空提交。
  keep-repo-active:
    # 触发条件：定时/手动选择keep_alive
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '55 19 1 * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_task == 'keep_alive')
    runs-on: ubuntu-latest
    name: Keep Scheduled Workflows Active
    permissions:
      contents: write  # 需要写权限才能推送空提交
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Push empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push